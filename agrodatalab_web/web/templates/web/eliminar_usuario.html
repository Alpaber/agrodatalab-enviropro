{% extends 'web/base.html' %}

{% block content %}
<div class="container" style="max-width: 700px;">
    <h1 class="mb-4">Eliminar usuario</h1>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} mb-3">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <div class="card shadow-sm border-danger">
        <div class="card-body">
            <p class="mb-3">
                ¿Seguro que quieres eliminar al usuario <strong>{{ usuario_obj.username }}</strong>?
            </p>

            <form method="post">
                {% csrf_token %}
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-danger">Sí, eliminar</button>
                    <a href="{% url 'admin_usuarios' %}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
